name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract native Android project
        run: |
          mkdir build-src
          unzip -q perimetru-guard-android-native.zip -d build-src

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: build-src/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: perimetru-guard-debug-apk
          path: build-src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
